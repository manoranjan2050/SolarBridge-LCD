[platformio]
src_dir = SolarBridge-LCD

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_port = COM9
monitor_port = COM9
lib_deps =
	tzapu/WiFiManager@^2.0.17
	bblanchon/ArduinoJson@^6.21.5
	marcoschwartz/LiquidCrystal_I2C@^1.1.4
build_flags =
	-DPIO_BUILD=1
