<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F1223"/>
      <stop offset="100%" stop-color="#1B1F3B"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFB347"/>
      <stop offset="100%" stop-color="#FF5E62"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB347" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFB347" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#43E97B" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#43E97B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lcdBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8FBF6E"/>
      <stop offset="100%" stop-color="#6FA652"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <circle cx="180" cy="120" r="260" fill="url(#glow1)"/>
  <circle cx="1000" cy="330" r="220" fill="url(#glow2)"/>

  <!-- Icon badge -->
  <circle cx="90" cy="95" r="40" fill="url(#bolt)"/>
  <path d="M96 66 L70 100 L88 100 L82 126 L112 90 L92 90 Z" fill="#ffffff"/>

  <!-- Title -->
  <text x="148" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="800" fill="#ffffff">Solar Bridge</text>
  <text x="148" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="800" fill="#FFB347">LCD Display</text>

  <text x="60" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#9AA0C3">
    <tspan x="60" dy="0">A tiny ESP8266 + 16x2 I2C satellite display for the Solar Bridge</tspan>
    <tspan x="60" dy="28">inverter/BMS monitor — live solar, load, battery and grid at a glance.</tspan>
  </text>

  <!-- badges -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#E7E9F5">
    <rect x="60" y="248" width="150" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="82" y="270">ESP8266</text>
    <rect x="222" y="248" width="150" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="244" y="270">16x2 I2C LCD</text>
    <rect x="384" y="248" width="180" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="406" y="270">Open Source</text>
  </g>

  <text x="60" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#6B7099">
    github.com/manoranjan2050/SolarBridge-LCD &#183; electroiot.in
  </text>

  <!-- LCD mockup -->
  <g transform="translate(760,90)">
    <rect x="-24" y="-24" width="368" height="228" rx="18" fill="#05060D" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
    <rect x="0" y="0" width="320" height="180" rx="4" fill="url(#lcdBg)"/>
    <rect x="0" y="0" width="320" height="180" rx="4" fill="#000000" fill-opacity="0.08"/>

    <!-- row 1: solar icon + reading -->
    <g transform="translate(18,40)" font-family="Consolas, 'Courier New', monospace" font-size="26" fill="#12331a">
      <rect x="0" y="-20" width="18" height="18" fill="#12331a"/>
      <rect x="3" y="-17" width="4" height="4" fill="#8FBF6E"/>
      <rect x="11" y="-17" width="4" height="4" fill="#8FBF6E"/>
      <rect x="3" y="-11" width="4" height="4" fill="#8FBF6E"/>
      <rect x="11" y="-11" width="4" height="4" fill="#8FBF6E"/>
      <text x="30" y="0">1024W</text>
    </g>
    <text x="18" y="96" font-family="Consolas, 'Courier New', monospace" font-size="24" fill="#12331a">Today 10.4kWh</text>

    <!-- row 2 divider hint -->
    <line x1="12" y1="112" x2="308" y2="112" stroke="#12331a" stroke-opacity="0.15" stroke-width="1"/>

    <!-- row 2: battery icon + reading -->
    <g transform="translate(18,152)" font-family="Consolas, 'Courier New', monospace" font-size="26" fill="#12331a">
      <rect x="4" y="-22" width="10" height="4" fill="#12331a"/>
      <rect x="0" y="-18" width="18" height="18" fill="none" stroke="#12331a" stroke-width="2"/>
      <text x="30" y="0">76%  &#9650; 6.2A</text>
    </g>
  </g>

  <!-- connecting dashes -->
  <g stroke="#ffffff" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="4 6">
    <line x1="600" y1="150" x2="736" y2="150"/>
  </g>
</svg>
